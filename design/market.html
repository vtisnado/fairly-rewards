<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Market · Fairly prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/base.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/setup.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-cream font-sans text-ink">
<div x-data="market()">
  <header class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2 text-2xl font-extrabold tracking-tight"><span x-html="coin('w-8 h-8')"></span><span x-text="BRAND"></span></a>
    <nav class="flex items-center gap-6 text-sm font-semibold"><a href="landing.html" class="text-ink/55 hover:text-ink transition">Home</a><a href="customer.html" class="text-ink/55 hover:text-ink transition">Get a card</a><span class="demo">(demo · test money)</span></nav>
  </header>

  <main class="max-w-7xl mx-auto px-6 pb-16">
    <section class="rounded-xl3 bg-ink text-white p-10 lg:p-14 relative overflow-hidden">
      <div class="max-w-lg relative z-10">
        <h1 class="text-6xl font-extrabold tracking-tight leading-[.95]">Cards with money already inside</h1>
        <p class="text-xl text-white/60 mt-4">People move. Their cards do not have to go to waste. Buy one and start at their level.</p>
      </div>
      <div class="absolute right-10 top-10 w-80 rotate-[8deg] animate-float hidden lg:block" style="--r:8deg" x-html="cardArt({shop:'bakery',balance:9.1,visits:7,tier:2})"></div>
      <div class="absolute right-56 top-36 w-72 rotate-[-6deg] animate-float [animation-delay:-2s] hidden lg:block" style="--r:-6deg" x-html="cardArt({shop:'gym',balance:3.2,visits:4,tier:1})"></div>
    </section>

    <div class="flex flex-wrap items-center gap-2 mt-8 text-sm font-semibold">
      <template x-for="f in filters"><button @click="filter=f[0]" class="h-10 px-4 rounded-xl flex items-center gap-2 border transition" :class="filter===f[0] ? 'bg-ink text-white border-ink' : 'bg-white border-ink/10 hover:border-ink/40'"><span x-show="f[1]" x-html="f[1] ? icon(f[1],'w-4 h-4') : ''"></span><span x-text="f[0]"></span></button></template>
      <div class="ml-auto flex items-center gap-2 text-ink/60">Sort by
        <div class="relative w-52" x-data="select([{value:'save',label:'Biggest savings'},{value:'value',label:'Most value inside'},{value:'price',label:'Lowest price'},{value:'level',label:'Highest level'}])" x-modelable="value" x-model="sort" @click.outside="open=false">
          <button @click="open=!open" class="w-full h-10 px-3 rounded-xl border bg-white text-ink font-semibold flex items-center justify-between transition" :class="open ? 'border-ink' : 'border-ink/10 hover:border-ink/40'"><span x-text="label()"></span><span class="transition" :class="open && 'rotate-180'" x-html="icon('chevron','w-4 h-4')"></span></button>
          <div x-show="open" x-transition.origin.top class="absolute right-0 z-30 mt-1.5 w-full bg-white border border-ink/10 rounded-xl shadow-card p-1.5">
            <template x-for="o in options"><button @click="pick(o)" class="w-full h-9 px-3 rounded-lg flex items-center justify-between text-ink hover:bg-cream transition"><span x-text="o.label"></span><span x-show="o.value===value" x-html="icon('check','w-4 h-4')"></span></button></template>
          </div>
        </div>
      </div>
    </div>
    <p class="mt-4 text-sm text-ink/50 font-semibold" x-text="list().length + ' cards for sale'"></p>

    <div class="mt-4 grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
      <template x-for="c in list()" :key="c.n">
        <article class="rounded-xl3 bg-white shadow-soft p-5 hover:-translate-y-1 transition">
          <div x-html="cardArt({shop:c.shop, balance:c.balance, visits:c.visits, tier:tierFor(c.visits), number:c.n})"></div>
          <div class="mt-5 flex items-center gap-3">
            <div class="flex-1 rounded-xl2 bg-sun p-3"><p class="text-xs font-semibold text-ink/60">Inside</p><p class="text-2xl font-extrabold" x-text="money(c.balance)"></p></div>
            <div class="flex-1 rounded-xl2 bg-cream p-3"><p class="text-xs font-semibold text-ink/60">Price</p><p class="text-2xl font-extrabold" x-text="money(c.price)"></p></div>
          </div>
          <button @click="pick=c" class="mt-3 w-full h-14 rounded-xl bg-ink text-white font-semibold flex items-center justify-between pl-6 pr-2 hover:bg-black transition">
            <span x-text="'Save ' + money(c.balance - c.price) + ' (' + Math.round((1-c.price/c.balance)*100) + '%)'"></span>
            <span class="w-10 h-10 rounded-lg bg-coral text-ink grid place-items-center" x-html="icon('arrow','w-5 h-5')"></span>
          </button>
        </article>
      </template>
    </div>
  </main>

  <div x-show="pick" x-cloak class="fixed inset-0 bg-ink/60 grid place-items-center p-6 z-50" @click.self="pick=null" x-ref="party">
    <div class="bg-cream rounded-xl3 p-8 w-full max-w-md animate-pop" x-show="pick && !bought">
      <template x-if="pick"><div>
        <div class="rotate-[-3deg]" x-html="cardArt({shop:pick.shop, balance:pick.balance, visits:pick.visits, tier:tierFor(pick.visits), number:pick.n})"></div>
        <div class="mt-6 space-y-2">
          <div class="flex justify-between rounded-full bg-white px-5 py-3"><span class="text-ink/60">You pay</span><b x-text="money(pick.price)"></b></div>
          <div class="flex justify-between rounded-full bg-white px-5 py-3"><span class="text-ink/60">Seller gets</span><b x-text="money(pick.price*0.95)"></b></div>
          <div class="flex justify-between rounded-full bg-white px-5 py-3"><span class="text-ink/60">Shop gets</span><b x-text="money(pick.price*0.05)"></b></div>
        </div>
        <button @click="bought=true; $nextTick(()=>confetti($refs.party,36))" class="mt-6 w-full h-14 rounded-full bg-coral font-bold">Buy card</button>
      </div></template>
    </div>
    <div class="bg-mint rounded-xl3 p-10 w-full max-w-md text-center animate-pop" x-show="bought">
      <span class="mx-auto w-20 h-20 rounded-full bg-ink text-mint grid place-items-center" x-html="icon('check','w-10 h-10')"></span>
      <p class="text-4xl font-extrabold mt-5">It is yours</p>
      <p class="mt-2">The card and its balance are on your phone now.</p>
      <button @click="pick=null; bought=false" class="mt-6 h-14 px-8 rounded-full bg-ink text-white font-semibold">Open my card</button>
    </div>
  </div>
</div>
<script>
function market() {
  return {
    pick: null, bought: false, filter: 'All',
    filters: [['All',''],['Coffee','cup'],['Barber','scissors'],['Gym','bolt'],['Bakery','cookie']],
    sort: 'save',
    cards: [
      { n: '0017', shop: 'cafe', cat: 'Coffee', balance: 24.6, visits: 7, price: 19 },
      { n: '0103', shop: 'barber', cat: 'Barber', balance: 31.5, visits: 6, price: 25 },
      { n: '0009', shop: 'gym', cat: 'Gym', balance: 42.0, visits: 8, price: 34 },
      { n: '0211', shop: 'bakery', cat: 'Bakery', balance: 15.75, visits: 6, price: 12 },
      { n: '0058', shop: 'cafe', cat: 'Coffee', balance: 11.2, visits: 4, price: 8.5 },
      { n: '0140', shop: 'gym', cat: 'Gym', balance: 18.9, visits: 5, price: 15 },
      { n: '0072', shop: 'barber', cat: 'Barber', balance: 9.6, visits: 3, price: 7 },
      { n: '0230', shop: 'bakery', cat: 'Bakery', balance: 27.3, visits: 9, price: 22 },
    ],
    list() {
      const r = this.cards.filter(c => this.filter === 'All' || c.cat === this.filter);
      const k = { save: c => -(c.balance - c.price), value: c => -c.balance, price: c => c.price, level: c => -c.visits }[this.sort];
      return r.sort((a, b) => k(a) - k(b));
    },
  };
}
</script>
</body>
</html>
